<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Racing - Pseudo 3D</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }
        #game-container {
            position: relative;
            width: 1024px;
            height: 768px;
            max-width: 100%;
            max-height: 100vh;
            background: #72D7EE; /* Couleur du ciel */
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated; /* Look rétro */
        }
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
            pointer-events: none;
        }
        #speedometer {
            font-size: 32px;
            color: #ffeb3b;
        }
        #start-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10;
        }
        h1 {
            font-size: 64px;
            margin-bottom: 10px;
            color: #FF5722;
            text-shadow: 4px 4px 0 #fff;
        }
        p { font-size: 20px; text-align: center; margin: 5px 0; }
        .blink { animation: blinker 1.5s linear infinite; margin-top: 30px; font-size: 24px; color: #ffeb3b; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="1024" height="768"></canvas>
    <div id="hud" style="display: none;">
        <div>Tour: <span id="lap-count">1/3</span></div>
        <div id="speedometer">0 km/h</div>
        <div>Pos: <span id="position">1</span>/5</div>
    </div>
    <div id="start-screen">
        <h1>RETRO RACING</h1>
        <p>Utilisez les flèches ou WASD pour conduire</p>
        <p>Haut/W: Accélérer | Bas/S: Freiner | Gauche/Droite: Tourner</p>
        <p class="blink">Appuyez sur ESPACE pour commencer</p>
    </div>
</div>

<script>
/**
 * MOTEUR PSEUDO-3D / OUTRUN STYLE
 * Aucune dépendance externe. Rendu en Canvas 2D pur.
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const uiLap = document.getElementById('lap-count');
const uiSpeed = document.getElementById('speedometer');
const uiPos = document.getElementById('position');
const startScreen = document.getElementById('start-screen');
const hud = document.getElementById('hud');

// Résolution interne (plus petite = plus rapide & look plus rétro)
const width = 1024;
const height = 768;

// Variables de jeu & Physique
const fps = 60;
const step = 1 / fps;
let widthHalf = width / 2;
let heightHalf = height / 2;

const segments = [];
const segmentLength = 200;
const rumbleLength = 3;
const trackLength = null; // Défini après génération
const lanes = 3;
const drawDistance = 300; // Nombre de segments dessinés

// Paramètres de caméra
const cameraHeight = 1000;
const cameraDepth = 1 / Math.tan((100 * Math.PI / 180) / 2); // FOV

// Paramètres du Joueur
let playerX = 0; // Centre
let playerZ = 0;
let speed = 0;
const maxSpeed = segmentLength / step; // Vitesse maximale
const accel = maxSpeed / 5;
const breaking = -maxSpeed;
const decel = -maxSpeed / 5;
const offRoadDecel = -maxSpeed / 2;
const offRoadLimit = maxSpeed / 4;
const centrifugal = 0.3; // Force centrifuge dans les virages

// Touches
const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, w: false, a: false, s: false, d: false };

// Etat de la partie
let isPlaying = false;
let currentLap = 1;
const totalLaps = 3;
let trackLengthTotal = 0;
let cars = []; // IA

// Couleurs
const COLORS = {
    SKY: '#72D7EE',
    TREE: '#005108',
    FOG: '#005108',
    LIGHT: { road: '#6B6B6B', grass: '#10AA10', rumble: '#555555', lane: '#CCCCCC' },
    DARK:  { road: '#696969', grass: '#009A00', rumble: '#BB0000', lane: '#696969' },
    START: { road: 'white', grass: 'white', rumble: 'white' }
};

// --- GÉNÉRATION DU CIRCUIT ---
function resetRoad() {
    segments.length = 0;
    
    // Helper pour ajouter des segments
    function addSegment(curve, y) {
        let n = segments.length;
        segments.push({
            index: n,
            p1: { world: { y: 0, z: n * segmentLength }, camera: {}, screen: {} },
            p2: { world: { y: 0, z: (n + 1) * segmentLength }, camera: {}, screen: {} },
            curve: curve,
            cars: [],
            clip: 0,
            color: Math.floor(n / rumbleLength) % 2 ? COLORS.DARK : COLORS.LIGHT
        });
    }

    function addRoad(enter, hold, leave, curve) {
        for(let i=0; i<enter; i++) addSegment(curve / enter * i, 0);
        for(let i=0; i<hold; i++) addSegment(curve, 0);
        for(let i=0; i<leave; i++) addSegment(curve / leave * (leave - i), 0);
    }

    // Ligne de départ
    addRoad(0, 10, 0, 0);
    for(let i=0; i<10; i++) segments[i].color = COLORS.START;

    // Design du circuit
    addRoad(20, 40, 20, 0); // Ligne droite
    addRoad(20, 60, 20, 2); // Virage droite
    addRoad(20, 40, 20, 0); // Ligne droite
    addRoad(20, 60, 20, -3); // Virage gauche serré
    addRoad(10, 20, 10, 0); // Courte ligne droite
    addRoad(20, 40, 20, 2); // Virage droite
    addRoad(10, 20, 10, 0);
    addRoad(20, 80, 20, -1); // Longue courbe gauche
    addRoad(20, 40, 20, 1);
    addRoad(20, 40, 20, 0); // Retour au départ

    trackLengthTotal = segments.length * segmentLength;
}

// --- GÉNÉRATION DES ADVERSAIRES (IA) ---
function resetCars() {
    cars = [];
    for (let i = 0; i < 4; i++) {
        let offset = (Math.random() * 1.6) - 0.8;
        let z = (Math.random() * (segments.length - 100) + 100) * segmentLength;
        let cSpeed = maxSpeed / 4 + Math.random() * maxSpeed / (i === 0 ? 1.5 : 2); // Le premier est plus rapide
        let car = { offset: offset, z: z, speed: cSpeed, percent: 0, color: ['#FF0000', '#0000FF', '#00FF00', '#FFFF00'][i] };
        let segment = findSegment(car.z);
        segment.cars.push(car);
        cars.push(car);
    }
}

function findSegment(z) {
    return segments[Math.floor(z / segmentLength) % segments.length];
}

// --- MATHS & PROJECTIONS ---
function project(p, cameraX, cameraY, cameraZ, cameraDepth, width, height, roadWidth) {
    p.camera.x = (p.world.x || 0) - cameraX;
    p.camera.y = (p.world.y || 0) - cameraY;
    p.camera.z = (p.world.z || 0) - cameraZ;
    p.screen.scale = cameraDepth / p.camera.z;
    p.screen.x = Math.round((width / 2) + (p.screen.scale * p.camera.x * width / 2));
    p.screen.y = Math.round((height / 2) - (p.screen.scale * p.camera.y * height / 2));
    p.screen.w = Math.round((p.screen.scale * roadWidth * width / 2));
}

// --- DESSIN GRAPHIQUE ---
function drawPolygon(x1, y1, x2, y2, x3, y3, x4, y4, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.lineTo(x3, y3);
    ctx.lineTo(x4, y4);
    ctx.closePath();
    ctx.fill();
}

function drawSegment(x1, y1, w1, x2, y2, w2, color) {
    // Herbe
    ctx.fillStyle = color.grass;
    ctx.fillRect(0, y2, width, y1 - y2);

    // Bordure (Rumble)
    let r1 = w1 / Math.max(6, 2 * lanes);
    let r2 = w2 / Math.max(6, 2 * lanes);
    drawPolygon(x1 - w1 - r1, y1, x1 - w1, y1, x2 - w2, y2, x2 - w2 - r2, y2, color.rumble);
    drawPolygon(x1 + w1 + r1, y1, x1 + w1, y1, x2 + w2, y2, x2 + w2 + r2, y2, color.rumble);

    // Route
    drawPolygon(x1 - w1, y1, x1 + w1, y1, x2 + w2, y2, x2 - w2, y2, color.road);

    // Lignes centrales
    if (color.lane) {
        let laneW1 = w1 * 2 / lanes;
        let laneW2 = w2 * 2 / lanes;
        let l1 = w1 / 32;
        let l2 = w2 / 32;
        for (let lane = 1; lane < lanes; lane++) {
            let p1 = x1 - w1 + lane * laneW1;
            let p2 = x2 - w2 + lane * laneW2;
            drawPolygon(p1 - l1, y1, p1 + l1, y1, p2 + l2, y2, p2 - l2, y2, color.lane);
        }
    }
}

// Dessin manuel d'une voiture (pour éviter d'utiliser des images externes)
function drawCar(x, y, scale, color, isPlayer=false, steer=0) {
    let w = 240 * scale;
    let h = 120 * scale;
    x = x - w / 2;
    y = y - h;

    // Ombres
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(x + w*0.1, y + h, w*0.8, h*0.2);

    // Roues Arrière
    ctx.fillStyle = '#111';
    ctx.fillRect(x - w*0.05, y + h*0.5, w*0.2, h*0.5);
    ctx.fillRect(x + w*0.85, y + h*0.5, w*0.2, h*0.5);

    // Roues Avant (avec angle de braquage si joueur)
    let wheelOffset = isPlayer ? steer * 15 * scale : 0;
    ctx.fillRect(x + w*0.1 + wheelOffset, y + h*0.1, w*0.15, h*0.35);
    ctx.fillRect(x + w*0.75 + wheelOffset, y + h*0.1, w*0.15, h*0.35);

    // Châssis bas
    ctx.fillStyle = color;
    ctx.fillRect(x + w*0.1, y + h*0.6, w*0.8, h*0.3);

    // Châssis haut (habitacle)
    ctx.fillRect(x + w*0.25, y + h*0.2, w*0.5, h*0.4);

    // Vitre / Pare-brise
    ctx.fillStyle = '#99DDFF';
    ctx.fillRect(x + w*0.3, y + h*0.25, w*0.4, h*0.2);
    
    // Aileron
    ctx.fillStyle = '#222';
    ctx.fillRect(x, y + h*0.8, w, h*0.1);
    ctx.fillRect(x + w*0.45, y + h*0.7, w*0.1, h*0.1);
    
    // Détails joueur
    if (isPlayer) {
        // Phares arrière
        ctx.fillStyle = '#FF0000';
        ctx.fillRect(x + w*0.15, y + h*0.65, w*0.1, h*0.1);
        ctx.fillRect(x + w*0.75, y + h*0.65, w*0.1, h*0.1);
    }
}

function drawBackground(offset) {
    // Ciel
    ctx.fillStyle = COLORS.SKY;
    ctx.fillRect(0, 0, width, heightHalf);

    // Soleil
    ctx.fillStyle = '#FFEB3B';
    ctx.beginPath();
    ctx.arc(width/2 - offset*0.5, heightHalf - 150, 50, 0, Math.PI*2);
    ctx.fill();

    // Montagnes (Parallax simple)
    ctx.fillStyle = '#444';
    let base = heightHalf;
    for(let i=0; i<10; i++) {
        let x = (i * 200 - offset * 2) % (width + 400) - 200;
        ctx.beginPath();
        ctx.moveTo(x, base);
        ctx.lineTo(x + 150, base - 100 + (i%3)*20);
        ctx.lineTo(x + 300, base);
        ctx.fill();
    }

    // Ligne d'horizon
    ctx.fillStyle = COLORS.LIGHT.grass;
    ctx.fillRect(0, heightHalf, width, heightHalf);
}


// --- LOGIQUE DE MISE A JOUR ---
function updatePosition(dt) {
    let playerSegment = findSegment(playerZ);
    let playerW = 80 * cameraDepth / cameraHeight; // Largeur approx du joueur
    let speedPercent = speed / maxSpeed;
    let dx = dt * 2 * speedPercent; // Vitesse de déplacement latéral

    // Contrôles de direction
    let steer = 0;
    if ((keys.ArrowLeft || keys.a) && speed > 0) {
        playerX -= dx;
        steer = -1;
    }
    if ((keys.ArrowRight || keys.d) && speed > 0) {
        playerX += dx;
        steer = 1;
    }

    // Force centrifuge : pousse le joueur vers l'extérieur du virage
    playerX -= (dx * speedPercent * playerSegment.curve * centrifugal);

    // Accélération et Freinage
    if (keys.ArrowUp || keys.w) {
        speed += accel * dt;
    } else if (keys.ArrowDown || keys.s) {
        speed += breaking * dt;
    } else {
        speed += decel * dt;
    }

    // Limites de terrain (Hors-piste)
    if ((playerX < -1 || playerX > 1) && speed > offRoadLimit) {
        speed += offRoadDecel * dt;
    }

    // Bornage de la vitesse
    playerX = Math.max(-2, Math.min(2, playerX));
    speed = Math.max(0, Math.min(speed, maxSpeed));
    
    // Mouvement Z
    playerZ += speed * dt;

    // Collision IA
    for (let n = 0; n < playerSegment.cars.length; n++) {
        let car = playerSegment.cars[n];
        let carW = 80 * cameraDepth / cameraHeight;
        if (speed > car.speed) {
            // Check chevauchement X
            if (overlap(playerX, playerW, car.offset, carW, 0.8)) {
                speed = car.speed * (car.speed/speed); // Ralentit fortement
                playerZ -= speed * dt; // Repousse un peu
            }
        }
    }

    // Mise à jour IA
    cars.forEach(car => {
        let oldSegment = findSegment(car.z);
        car.offset += car.speed/maxSpeed * dt * 0.1 * (car.offset > 0 ? -1 : 1); // Tend vers le centre
        car.z += car.speed * dt;
        
        let newSegment = findSegment(car.z);
        if (oldSegment !== newSegment) {
            let index = oldSegment.cars.indexOf(car);
            if(index > -1) oldSegment.cars.splice(index, 1);
            newSegment.cars.push(car);
        }
    });

    // Tours
    if (playerZ >= trackLengthTotal) {
        playerZ -= trackLengthTotal;
        currentLap++;
        if (currentLap > totalLaps) {
            endGame();
        } else {
            uiLap.innerText = currentLap + "/" + totalLaps;
        }
    }

    return steer;
}

function overlap(x1, w1, x2, w2, percent) {
    let half1 = (w1 / 2) * percent;
    let half2 = (w2 / 2) * percent;
    let min1 = x1 - half1;
    let max1 = x1 + half1;
    let min2 = x2 - half2;
    let max2 = x2 + half2;
    return !((max1 < min2) || (min1 > max2));
}

// --- BOUCLE DE RENDU ---
function render(steer) {
    let baseSegment = findSegment(playerZ);
    let basePercent = (playerZ % segmentLength) / segmentLength;
    
    let cameraZ = playerZ;
    let cameraX = playerX * 2000; // Road width scale
    
    // Décalage du décor basé sur les courbes accumulées
    let totalCurve = 0;
    
    let x = 0;
    let dx = - (baseSegment.curve * basePercent);

    // Initialisation
    ctx.clearRect(0, 0, width, height);
    drawBackground(playerX * 100); 

    let maxy = height;
    
    // Rendu de la route de l'avant vers l'arrière pour calculer les projections
    let segmentsToDraw = [];
    for (let n = 0; n < drawDistance; n++) {
        let segment = segments[(baseSegment.index + n) % segments.length];
        let looped = segment.index < baseSegment.index;
        
        segment.clip = maxy;

        project(segment.p1, cameraX - x, cameraHeight, cameraZ - (looped ? trackLengthTotal : 0), cameraDepth, width, height, 2000);
        project(segment.p2, cameraX - x - dx, cameraHeight, cameraZ - (looped ? trackLengthTotal : 0), cameraDepth, width, height, 2000);

        x += dx;
        dx += segment.curve;

        if ((segment.p1.camera.z <= cameraDepth) || (segment.p2.screen.y >= maxy) || (segment.p2.screen.y >= segment.p1.screen.y)) {
            continue;
        }

        drawSegment(segment.p1.screen.x, segment.p1.screen.y, segment.p1.screen.w,
                    segment.p2.screen.x, segment.p2.screen.y, segment.p2.screen.w,
                    segment.color);

        maxy = segment.p1.screen.y;
        segmentsToDraw.push(segment); // Garder pour dessiner les sprites
    }

    // Rendu des sprites (IA) d'arrière en avant
    for(let n = segmentsToDraw.length - 1; n >= 0; n--) {
        let segment = segmentsToDraw[n];
        for(let i=0; i<segment.cars.length; i++) {
            let car = segment.cars[i];
            let spriteScale = segment.p1.screen.scale;
            let spriteX = segment.p1.screen.x + (spriteScale * car.offset * 2000 * width / 2);
            let spriteY = segment.p1.screen.y;
            drawCar(spriteX, spriteY, spriteScale * 200, car.color);
        }
    }

    // Rendu du Joueur (fixe en bas de l'écran)
    let bounce = (1.5 * Math.random() * speed/maxSpeed) * (segments[baseSegment.index].color == COLORS.DARK ? -1 : 1);
    drawCar(width / 2, height - 10 + bounce, 0.005 * cameraDepth, '#FFF', true, steer);

    // HUD Update
    let speedKmH = Math.round((speed / maxSpeed) * 250); // Vitesse affichée fictive
    uiSpeed.innerText = speedKmH + " km/h";
    uiSpeed.style.color = speedKmH > 220 ? '#FF5722' : '#ffeb3b';

    // Position calcul (simple)
    let rank = 1;
    cars.forEach(car => {
        let pZ = playerZ + (currentLap * trackLengthTotal);
        let cZ = car.z; // Les voitures IA bouclent aussi mais ici on simplifie
        if(cZ > pZ && car.speed > 0) rank++;
    });
    uiPos.innerText = rank;
}

// --- BOUCLE PRINCIPALE ---
let lastTime = performance.now();
function gameLoop(time) {
    if(!isPlaying) return;

    let dt = (time - lastTime) / 1000;
    // Si la page est en arrière plan, dt peut être énorme, on le cap.
    if(dt > 0.1) dt = 0.1; 
    
    lastTime = time;

    let steer = updatePosition(dt);
    render(steer);

    requestAnimationFrame(gameLoop);
}

// --- CONTROLES & GESTION DU JEU ---
window.addEventListener('keydown', (e) => {
    if(keys.hasOwnProperty(e.key)) keys[e.key] = true;
    if(e.code === 'Space' && !isPlaying) {
        startGame();
    }
});

window.addEventListener('keyup', (e) => {
    if(keys.hasOwnProperty(e.key)) keys[e.key] = false;
});

function startGame() {
    startScreen.style.display = 'none';
    hud.style.display = 'flex';
    resetRoad();
    resetCars();
    playerZ = 0;
    playerX = 0;
    speed = 0;
    currentLap = 1;
    uiLap.innerText = "1/" + totalLaps;
    isPlaying = true;
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
}

function endGame() {
    isPlaying = false;
    startScreen.style.display = 'flex';
    startScreen.innerHTML = `
        <h1>COURSE TERMINÉE !</h1>
        <p>Position finale : ${uiPos.innerText} sur 5</p>
        <p class="blink">Appuyez sur ESPACE pour recommencer</p>
    `;
}

// Premier dessin pour le fond avant de commencer
drawBackground(0);

</script>
</body>
</html>
